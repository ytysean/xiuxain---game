<?xml version="1.0" encoding="UTF-8"?>
<!-- 锁 / Lock — 锁身 + 锁梁 + 锁孔，取未解锁之象。统一暗金描边 #C8A86A，线稿，无填充。viewBox 64×64，stroke-width 4。-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#C8A86A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- 锁身 -->
  <rect x="18" y="30" width="28" height="22" rx="3"/>
  <!-- 锁梁 -->
  <path d="M24 30 V22 a8 8 0 0 1 16 0 V30"/>
  <!-- 锁孔 -->
  <line x1="32" y1="38" x2="32" y2="46"/>
</svg>
