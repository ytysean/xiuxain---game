<?xml version="1.0" encoding="UTF-8"?>
<!-- 纪事 / Chronicle — 底部 Tab"纪事"图标。古籍 + 狼毫笔，取录事成文之象（区别于卷轴/簿册）。-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#C8A86A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- 古籍（偏左，闭合装帧） -->
  <rect x="12" y="22" width="22" height="24" rx="1"/>
  <line x1="16" y1="29" x2="30" y2="29"/>
  <line x1="16" y1="34" x2="30" y2="34"/>
  <line x1="16" y1="39" x2="30" y2="39"/>
  <!-- 书脊竖线 -->
  <line x1="12" y1="22" x2="34" y2="22"/>
  <line x1="12" y1="46" x2="34" y2="46"/>
  <!-- 狼毫笔杆（右上斜下） -->
  <line x1="42" y1="14" x2="54" y2="44"/>
  <!-- 笔锋（泪滴状） -->
  <path d="M54 44 Q58 48 54 50 Q50 50 54 44"/>
</svg>
