<!-- 殿宇 / Hall — 核心宫格"建筑"图标。统一暗金描边 #C8A86A，线稿，无填充。viewBox 64×64，stroke-width 4。-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#C8A86A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(-4.571, -10.286) scale(1.142857)" stroke-width="3.5">
  <!-- 须弥座（基座） -->
  <rect x="14" y="48" width="36" height="6" rx="1"/>
  <!-- 双柱 -->
  <line x1="22" y1="40" x2="22" y2="48"/>
  <line x1="42" y1="40" x2="42" y2="48"/>
  <!-- 庑殿顶（带反宇上翘的屋檐 + 屋脊） -->
  <path d="M11 35 Q14 39 14 40 L22 28 L42 28 L50 40 Q53 39 53 35"/>
  <!-- 脊饰 / 法器 -->
  <line x1="32" y1="20" x2="32" y2="28"/>
  <line x1="28" y1="20" x2="36" y2="20"/>
  </g>
</svg>
