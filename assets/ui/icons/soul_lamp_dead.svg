<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- 修真命魂灯：熄灭（陨落）。透明底。修真界「命灯灭」=弟子殒命，从此不再有绿焰。 -->
  <!-- 灯座（暗灰：灵性已失） -->
  <path d="M5 19H19L17.2 21H6.8L5 19Z" stroke="#7A7D82" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 灯柱 -->
  <line x1="12" y1="19" x2="12" y2="15" stroke="#7A7D82" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 灯芯顶横档（标识熄灭：无焰，仅余残芯） -->
  <line x1="9.5" y1="14" x2="14.5" y2="14" stroke="#5A5D62" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 飘散的余烟（虚线点画，修真界「魂归天际」意象） -->
  <path d="M11.5 12.8 Q10.4 11 11.5 9.5 Q12.6 8.2 11.5 7" stroke="#6B6E72" stroke-width="1" stroke-linecap="round" fill="none" stroke-dasharray="1.2 1.4"/>
</svg>
