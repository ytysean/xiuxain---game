<?xml version="1.0" encoding="UTF-8"?>
<!-- 庶务 / Chores — 卷轴 + 行文，取庶务之象。统一暗金描边 #C8A86A，线稿，无填充。viewBox 64×64，stroke-width 4。-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#C8A86A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- 上下卷轴 -->
  <rect x="18" y="9" width="28" height="6" rx="3"/>
  <rect x="18" y="49" width="28" height="6" rx="3"/>
  <!-- 卷身两侧 -->
  <line x1="22" y1="15" x2="22" y2="49"/>
  <line x1="42" y1="15" x2="42" y2="49"/>
  <!-- 行文 -->
  <line x1="27" y1="26" x2="37" y2="26"/>
  <line x1="27" y1="34" x2="37" y2="34"/>
  <line x1="27" y1="42" x2="37" y2="42"/>
</svg>
