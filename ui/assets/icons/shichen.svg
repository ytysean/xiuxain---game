<?xml version="1.0" encoding="UTF-8"?>
<!-- 时辰 / Time (日轮八芒) — 状态栏"时辰"图标。日轮 + 8 芒角，取一日时辰之象。-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#C8A86A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- 日轮 -->
  <circle cx="32" cy="32" r="10"/>
  <!-- 八芒角 -->
  <line x1="32" y1="18" x2="32" y2="10"/>
  <line x1="32" y1="46" x2="32" y2="54"/>
  <line x1="18" y1="32" x2="10" y2="32"/>
  <line x1="46" y1="32" x2="54" y2="32"/>
  <line x1="42" y1="22" x2="48" y2="16"/>
  <line x1="22" y1="42" x2="16" y2="48"/>
  <line x1="42" y1="42" x2="48" y2="48"/>
  <line x1="22" y1="22" x2="16" y2="16"/>
</svg>
