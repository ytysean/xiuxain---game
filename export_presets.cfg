; 太玄宗门录 · Godot 4.7 正式导出预设（PH6-C6b · 发布运维 路远行 · 2026-09-16）
;
; 缘起：项目从立项至今从未导出过。C6 已装好 4.7 导出模板（唯一阻塞已解），本文件把 C6 草案
; （export_presets.cfg.draft，保留留档不动）转正，并新增 Windows Desktop 预设。
; 字段名/键名均已对照 Godot 4.7-stable 源码核实（platform/windows/export/export_plugin.cpp、
; editor/export/editor_export_platform_pc.cpp），非凭记忆。
;
; ── [preset.0] Android ────────────────────────────────────────────────
;   保留草案既定取舍，一律照旧：非 gradle 构建（走内置模板 android_*.apk）、APK（非 AAB）、
;   仅 arm64-v8a、包名 com.taixuan.zongmenlu / 应用名「太玄宗门录」、immersive 沉浸模式。
;   签名走 debug：keystore/debug 留空 ⇒ 由 Godot 编辑器自动生成并签发（见 tech 方案 §2）。
;   ✅ 模板：已就位（export_templates/4.7.stable/android_debug.apk / android_release.apk）
;   ❌ JDK：完全未装   ❌ Android SDK：完全未装（platform-tools + build-tools 均缺）
;   ⇒ Android 目前【不可导出】；工具链安装方案见 docs/tech/PH6-导出链路上线方案_2026-09-16.md
;   ⚠️ 另需项目设置 rendering/textures/vram_compression/import_etc2_astc=true，否则 CLI 导出会被
;      EditorExportPlatform::can_export() 直接拦下（方案 §4 有源码依据）。
;
; ── [preset.1] Windows Desktop ────────────────────────────────────────
;   新增。Windows 导出【不需要任何额外工具链】，模板（windows_{debug,release}_x86_64.exe）已就位，
;   ⇒ 模板装好后即可直接产出项目史上第一个可运行包，是对整条导出链路最快的端到端验证。
;   未开代码签名（codesign/enable=false）；未嵌入 pck（binary_format/embed_pck=false ⇒ 同时产出 .exe 与同名 .pck）。
;
; 编码：UTF-8（无 BOM），换行：LF。

