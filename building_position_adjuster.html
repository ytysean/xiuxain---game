<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>殿阁位置调整工具 - 可拖动</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  font-family: "Microsoft YaHei", sans-serif;
  overflow: auto;
  padding: 20px;
}
.toolbar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  background: rgba(13,27,42,0.95);
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid #c9a45c;
  z-index: 10000;
  display: flex;
  gap: 15px;
  align-items: center;
  flex-wrap: wrap;
}
.toolbar button {
  padding: 8px 16px;
  background: #c9a45c;
  color: #1a1a2e;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}
.toolbar button:hover { background: #e8d5b7; }
.toolbar .info {
  color: #e8d5b7;
  font-size: 14px;
}
.toolbar select {
  padding: 6px 12px;
  background: #1a2a3a;
  color: #e8d5b7;
  border: 1px solid #c9a45c;
  border-radius: 4px;
}
.canvas-container {
  margin-top: 80px;
  display: flex;
  justify-content: center;
}
.phone-frame {
  width: 1080px;
  height: 1920px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 50px rgba(0,0,0,0.8);
  flex-shrink: 0;
}
.panorama-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('https://aka.doubaocdn.com/s/IEWu2lTxwt') center/cover no-repeat;
  z-index: 1;
}
.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 80px;
  background: linear-gradient(180deg, rgba(13,27,42,0.95) 0%, rgba(13,27,42,0.3) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  z-index: 100;
}
.top-bar .title {
  color: #c9a45c;
  font-size: 32px;
  font-weight: bold;
}
.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 120px;
  background: linear-gradient(0deg, rgba(13,27,42,0.98) 0%, rgba(13,27,42,0.5) 100%);
  z-index: 100;
}
/* 可拖动的热点区 */
.draggable-hotspot {
  position: absolute;
  border: 2px dashed #ff6b6b;
  background: rgba(255,107,107,0.15);
  cursor: move;
  z-index: 50;
  resize: both;
  overflow: hidden;
  min-width: 50px;
  min-height: 50px;
}
.draggable-hotspot .hotspot-label {
  position: absolute;
  top: -25px;
  left: 0;
  background: #ff6b6b;
  color: white;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  white-space: nowrap;
}
.draggable-hotspot .resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 15px;
  height: 15px;
  background: #ff6b6b;
  cursor: nwse-resize;
}
/* 可拖动的文字标签 */
.draggable-label {
  position: absolute;
  writing-mode: vertical-rl;
  text-orientation: upright;
  color: #e8d5b7;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  padding: 12px 8px;
  background: rgba(13,27,42,0.7);
  border-left: 2px solid #c9a45c;
  cursor: move;
  z-index: 60;
  user-select: none;
}
.draggable-label.right-side {
  writing-mode: vertical-lr;
  border-left: none;
  border-right: 2px solid #c9a45c;
}
.draggable-label .label-name {
  display: block;
}
.draggable-label .label-coords {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  background: #c9a45c;
  color: #1a1a2e;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  white-space: nowrap;
  writing-mode: horizontal-tb;
}
/* 导出面板 */
.export-panel {
  position: fixed;
  top: 80px;
  right: 10px;
  width: 400px;
  max-height: 80vh;
  background: rgba(13,27,42,0.98);
  padding: 20px;
  border-radius: 8px;
  border: 1px solid #c9a45c;
  z-index: 10000;
  overflow-y: auto;
  display: none;
}
.export-panel.show { display: block; }
.export-panel h3 {
  color: #c9a45c;
  margin-bottom: 15px;
}
.export-panel textarea {
  width: 100%;
  height: 400px;
  background: #1a2a3a;
  color: #e8d5b7;
  border: 1px solid #c9a45c;
  border-radius: 4px;
  padding: 10px;
  font-family: monospace;
  font-size: 12px;
  resize: vertical;
}
.export-panel .close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ff6b6b;
  color: white;
  border: none;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="exportPositions()">导出位置坐标</button>
  <button onclick="resetPositions()">重置位置</button>
  <button onclick="toggleHotspots()">显示/隐藏热点区</button>
  <button onclick="toggleLabels()">显示/隐藏文字框</button>
  <select id="selectBuilding" onchange="selectBuilding()">
    <option value="">选择殿阁高亮</option>
    <option value="xichi">洗池·灵泉</option>
    <option value="yushou">御兽堂</option>
    <option value="zhenfa">阵法堂</option>
    <option value="tanwei">探微堂</option>
    <option value="cangjing">藏经阁</option>
    <option value="zhifa">执法堂</option>
    <option value="gongxun">功勋堂</option>
    <option value="lingtian">灵田</option>
    <option value="kuangmai">矿脉</option>
    <option value="dantang">丹堂</option>
    <option value="qitang">器堂</option>
    <option value="yuying">接引殿</option>
  </select>
  <span class="info">拖动红色框=热点区，拖动文字=标签位置。调整好后点"导出位置坐标"复制给我。</span>
</div>

<div class="export-panel" id="exportPanel">
  <button class="close-btn" onclick="closeExport()">×</button>
  <h3>位置坐标（复制给我）</h3>
  <textarea id="exportTextarea" readonly></textarea>
</div>

<div class="canvas-container">
  <div class="phone-frame" id="phoneFrame">
    <div class="panorama-bg"></div>
    <div class="top-bar">
      <div class="title">太玄宗</div>
    </div>
    <div class="bottom-nav"></div>
    
    <!-- 12个可拖动的热点区和文字标签 -->
    <!-- 由JS动态生成 -->
  </div>
</div>

<script>
// 12个殿阁的初始位置（基于之前的估算）
const buildings = [
  { id: 'xichi', name: '洗池·灵泉', hotspot: {x: 400, y: 30, w: 280, h: 90}, label: {x: 580, y: 50, side: 'left'} },
  { id: 'yushou', name: '御兽堂', hotspot: {x: 40, y: 160, w: 160, h: 110}, label: {x: 210, y: 185, side: 'left'} },
  { id: 'zhenfa', name: '阵法堂', hotspot: {x: 880, y: 160, w: 160, h: 110}, label: {x: 830, y: 185, side: 'right'} },
  { id: 'tanwei', name: '探微堂', hotspot: {x: 390, y: 320, w: 300, h: 150}, label: {x: 570, y: 360, side: 'left'} },
  { id: 'cangjing', name: '藏经阁', hotspot: {x: 30, y: 480, w: 230, h: 190}, label: {x: 270, y: 540, side: 'left'} },
  { id: 'zhifa', name: '执法堂', hotspot: {x: 820, y: 480, w: 230, h: 190}, label: {x: 770, y: 540, side: 'right'} },
  { id: 'gongxun', name: '功勋堂', hotspot: {x: 380, y: 720, w: 320, h: 150}, label: {x: 580, y: 760, side: 'left'} },
  { id: 'lingtian', name: '灵田', hotspot: {x: 20, y: 920, w: 250, h: 130}, label: {x: 280, y: 955, side: 'left'} },
  { id: 'kuangmai', name: '矿脉', hotspot: {x: 810, y: 920, w: 250, h: 130}, label: {x: 760, y: 955, side: 'right'} },
  { id: 'dantang', name: '丹堂', hotspot: {x: 30, y: 1150, w: 230, h: 150}, label: {x: 270, y: 1195, side: 'left'} },
  { id: 'qitang', name: '器堂', hotspot: {x: 820, y: 1150, w: 230, h: 150}, label: {x: 770, y: 1195, side: 'right'} },
  { id: 'yuying', name: '接引殿', hotspot: {x: 380, y: 1380, w: 320, h: 130}, label: {x: 580, y: 1410, side: 'left'} },
];

let showHotspots = true;
let showLabels = true;
let selectedBuilding = null;

// 初始化
function init() {
  const phoneFrame = document.getElementById('phoneFrame');
  
  buildings.forEach(b => {
    // 创建热点区
    const hotspot = document.createElement('div');
    hotspot.className = 'draggable-hotspot';
    hotspot.id = `hotspot-${b.id}`;
    hotspot.style.left = b.hotspot.x + 'px';
    hotspot.style.top = b.hotspot.y + 'px';
    hotspot.style.width = b.hotspot.w + 'px';
    hotspot.style.height = b.hotspot.h + 'px';
    hotspot.innerHTML = `
      <div class="hotspot-label">${b.name} 热点区</div>
      <div class="resize-handle"></div>
    `;
    phoneFrame.appendChild(hotspot);
    
    // 创建文字标签
    const label = document.createElement('div');
    label.className = 'draggable-label' + (b.label.side === 'right' ? ' right-side' : '');
    label.id = `label-${b.id}`;
    label.style.left = b.label.x + 'px';
    label.style.top = b.label.y + 'px';
    label.innerHTML = `
      <span class="label-name">${b.name}</span>
      <span class="label-coords" id="coords-${b.id}">x:${b.label.x} y:${b.label.y}</span>
    `;
    phoneFrame.appendChild(label);
    
    // 使热点区可拖动
    makeDraggable(hotspot, b.id, 'hotspot');
    
    // 使文字标签可拖动
    makeDraggable(label, b.id, 'label');
  });
}

// 使元素可拖动
function makeDraggable(element, buildingId, type) {
  let isDragging = false;
  let startX, startY, initialX, initialY;
  
  element.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    initialX = parseInt(element.style.left);
    initialY = parseInt(element.style.top);
    element.style.zIndex = '200';
    e.preventDefault();
  });
  
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const newX = Math.max(0, Math.min(1080 - element.offsetWidth, initialX + dx));
    const newY = Math.max(80, Math.min(1800, initialY + dy));
    element.style.left = newX + 'px';
    element.style.top = newY + 'px';
    
    // 更新坐标显示
    if (type === 'label') {
      const coordsEl = document.getElementById(`coords-${buildingId}`);
      if (coordsEl) coordsEl.textContent = `x:${newX} y:${newY}`;
    }
  });
  
  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      element.style.zIndex = type === 'hotspot' ? '50' : '60';
    }
  });
}

// 导出位置坐标
function exportPositions() {
  let result = '// 12个殿阁的最终位置坐标\n';
  result += '// 格式：{ id, name, hotspot: {x, y, w, h}, label: {x, y, side} }\n\n';
  result += 'const buildings = [\n';
  
  buildings.forEach((b, index) => {
    const hotspot = document.getElementById(`hotspot-${b.id}`);
    const label = document.getElementById(`label-${b.id}`);
    
    const hx = parseInt(hotspot.style.left);
    const hy = parseInt(hotspot.style.top);
    const hw = hotspot.offsetWidth;
    const hh = hotspot.offsetHeight;
    
    const lx = parseInt(label.style.left);
    const ly = parseInt(label.style.top);
    
    result += `  { id: '${b.id}', name: '${b.name}', hotspot: {x: ${hx}, y: ${hy}, w: ${hw}, h: ${hh}}, label: {x: ${lx}, y: ${ly}, side: '${b.label.side}'} }${index < buildings.length - 1 ? ',' : ''}\n`;
  });
  
  result += '];\n';
  
  document.getElementById('exportTextarea').value = result;
  document.getElementById('exportPanel').classList.add('show');
}

// 关闭导出面板
function closeExport() {
  document.getElementById('exportPanel').classList.remove('show');
}

// 重置位置
function resetPositions() {
  if (!confirm('确定要重置所有位置吗？')) return;
  buildings.forEach(b => {
    const hotspot = document.getElementById(`hotspot-${b.id}`);
    const label = document.getElementById(`label-${b.id}`);
    
    hotspot.style.left = b.hotspot.x + 'px';
    hotspot.style.top = b.hotspot.y + 'px';
    hotspot.style.width = b.hotspot.w + 'px';
    hotspot.style.height = b.hotspot.h + 'px';
    
    label.style.left = b.label.x + 'px';
    label.style.top = b.label.y + 'px';
    
    const coordsEl = document.getElementById(`coords-${b.id}`);
    if (coordsEl) coordsEl.textContent = `x:${b.label.x} y:${b.label.y}`;
  });
}

// 显示/隐藏热点区
function toggleHotspots() {
  showHotspots = !showHotspots;
  buildings.forEach(b => {
    const hotspot = document.getElementById(`hotspot-${b.id}`);
    hotspot.style.display = showHotspots ? 'block' : 'none';
  });
}

// 显示/隐藏文字框
function toggleLabels() {
  showLabels = !showLabels;
  buildings.forEach(b => {
    const label = document.getElementById(`label-${b.id}`);
    label.style.display = showLabels ? 'block' : 'none';
  });
}

// 选择殿阁高亮
function selectBuilding() {
  const id = document.getElementById('selectBuilding').value;
  
  // 重置所有样式
  buildings.forEach(b => {
    const hotspot = document.getElementById(`hotspot-${b.id}`);
    const label = document.getElementById(`label-${b.id}`);
    hotspot.style.borderColor = '#ff6b6b';
    label.style.borderColor = '#c9a45c';
  });
  
  if (id) {
    const hotspot = document.getElementById(`hotspot-${id}`);
    const label = document.getElementById(`label-${id}`);
    hotspot.style.borderColor = '#00ff00';
    hotspot.style.zIndex = '300';
    label.style.borderColor = '#00ff00';
    label.style.zIndex = '300';
    
    // 滚动到视图
    hotspot.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// 初始化
init();
</script>

</body>
</html>
